
name: ShopEase Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: shopease-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Temporary diagnostic step to identify the OIDC subject
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          printf '%s' "$TOKEN" | cut -d '.' -f2 | \
            python3 -c '
          import sys, json, base64
          s = sys.stdin.read()
          s += "=" * (-len(s) % 4)
          data = json.loads(base64.urlsafe_b64decode(s))
          print(json.dumps({k: data.get(k) for k in
            ["iss", "aud", "sub", "repository", "repository_id",
             "repository_owner", "repository_owner_id", "ref"]}, indent=2))
          '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy backend using AWS SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -Eeuo pipefail

          sudo -u ec2-user bash -s <<'DEPLOY'
          set -Eeuo pipefail

          APP_DIR="/home/ec2-user/shopease-backend"
          STAGE_DIR=$(mktemp -d /home/ec2-user/shopease-stage.XXXXXX)
          BACKUP_DIR="/home/ec2-user/deploy-backups"

          trap 'rm -rf "$STAGE_DIR"' EXIT

          echo "Downloading latest backend source..."

          git clone --depth 1 --branch main \
            https://github.com/Binduathyam/E-CommerceApplication.git \
            "$STAGE_DIR/repo"

          if [ ! -f "$STAGE_DIR/repo/backend/package.json" ]; then
            echo "ERROR: backend/package.json not found"
            exit 1
          fi

          echo "Creating backup..."

          mkdir -p "$BACKUP_DIR"

          tar -czf "$BACKUP_DIR/backend-$(date +%Y%m%d-%H%M%S).tar.gz" \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=uploads \
            --exclude=actions-runner \
            -C "$APP_DIR" .

          echo "Installing rsync if required..."

          if ! command -v rsync >/dev/null 2>&1; then
            sudo dnf install -y rsync
          fi

          echo "Updating backend files..."

          rsync -a \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='uploads/' \
            --exclude='backup*/' \
            --exclude='actions-runner/' \
            "$STAGE_DIR/repo/backend/" "$APP_DIR/"

          cd "$APP_DIR"

          echo "Installing production dependencies..."

          npm install --omit=dev

          echo "Restarting backend..."

          pm2 restart shopease-backend --update-env

          pm2 status shopease-backend

          echo "Backend deployment completed."
          DEPLOY
          REMOTE
          )

          COMMANDS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ShopEase backend deployment" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
