      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -er '.value')

          TOKEN="$TOKEN" python3 - <<'PY'
          import os, json, base64

          token = os.environ["TOKEN"].strip()
          parts = token.split(".")

          print("JWT segments:", len(parts))

          if len(parts) != 3:
              raise SystemExit("Invalid JWT structure")

          payload = parts[1]
          payload += "=" * (-len(payload) % 4)

          decoded = base64.urlsafe_b64decode(payload)
          data = json.loads(decoded)

          keys = [
              "iss", "aud", "sub", "repository",
              "repository_id", "repository_owner",
              "repository_owner_id", "ref"
          ]

          print(json.dumps(
              {key: data.get(key) for key in keys},
              indent=2
          ))
          PY
